<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Number Crunch</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a12; --surface: #13131f; --border: #2a2a3e; --text: #e0e0f0; --muted: #6a6a8a; --accent: #00e6a0; --blue: #4488ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; text-align: center;
  }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2rem; width: 100%; max-width: 400px; }
  .code {
    font-family: 'DM Mono', monospace; font-size: 4.5rem; font-weight: 500; line-height: 1;
    color: var(--accent); text-shadow: 0 0 60px rgba(0, 230, 160, 0.3);
  }
  h1 {
    font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; margin: 1rem 0 0.4rem;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  p { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  a {
    display: inline-block; padding: 0.85rem 2rem; border-radius: 8px; background: var(--accent); color: var(--bg);
    font-weight: 700; text-decoration: none; transition: opacity 0.2s;
  }
  a:hover { opacity: 0.9; }
</style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>There's nothing at this address.</p>
    <a href="/">Back to Number Crunch</a>
  </main>
</body>
</html>
